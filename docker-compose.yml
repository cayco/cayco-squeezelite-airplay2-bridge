      - LMS_CLI_PORT=${LMS_CLI_PORT:-9090}
      - PLAYER_NAME=${ZONE2_PLAYER_NAME:-Zone2}
      - PLAYER_MAC=${ZONE2_PLAYER_MAC:-aa:aa:00:00:00:02}
      - AIRPLAY_ID=${ZONE2_AIRPLAY_ID:-AABBCCDDEE02}
      - AIRPLAY_IP=${ZONE2_AIRPLAY_IP:-192.168.1.102}
